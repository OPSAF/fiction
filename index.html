<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端之梦 Terminal Phantasm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ========== 基础变量与重置 ========== */
        :root {
            --bg-primary: #0B0B0C;
            --bg-secondary: #111118;
            --bg-tertiary: #18181f;
            --accent-blue: #00d4ff;
            --accent-purple: #7c3aed;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --terminal-green: #00ff88;
            --glass-bg: rgba(15, 18, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --quote-color: rgba(245, 158, 11, 0.85);
            --quote-bg: rgba(245, 158, 11, 0.03);
            --quote-border: rgba(245, 158, 11, 0.35);
            --dialogue-color: #f0e6d3;
            --char-akane: #f59e0b;
            --char-koyuki: #38bdf8;
            --char-zero: #00d4ff;
            --char-eve: #a855f7;
        }

        [data-theme="light"] {
            --bg-primary: #FFFFFF;
            --bg-secondary: #f5f5f7;
            --bg-tertiary: #ececee;
            --accent-blue: #FF2A55;
            --accent-purple: #cc1144;
            --text-primary: #1a1a2e;
            --text-secondary: #666680;
            --terminal-green: #16a34a;
            --glass-bg: rgba(250, 250, 252, 0.82);
            --glass-border: rgba(0, 0, 0, 0.08);
            --quote-color: rgba(220, 38, 38, 0.85);
            --quote-bg: rgba(220, 38, 38, 0.03);
            --quote-border: rgba(220, 38, 38, 0.3);
            --dialogue-color: #2d1810;
            --char-akane: #dc2626;
            --char-koyuki: #2563eb;
            --char-zero: #dc2626;
            --char-eve: #9333ea;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; overflow-y: scroll; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ========== Liquid Glass 面板（性能友好版） ========== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            contain: layout style;
        }

        /* ========== KV 主视觉区 ========== */
        #kv-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }

        #kv-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .kv-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
        }

        .kv-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(28px, 6vw, 56px);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: filter 0.4s ease, text-shadow 0.4s ease;
            cursor: default;
        }

        .kv-title:hover {
            filter: brightness(1.3);
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3), 0 0 60px rgba(124, 58, 237, 0.15);
        }

        .kv-subtitle {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(18px, 3vw, 28px);
            font-style: italic;
            color: var(--text-secondary);
            margin-top: 12px;
            letter-spacing: 4px;
        }

        .kv-quote {
            font-family: 'Noto Serif JP', serif;
            font-size: clamp(14px, 2vw, 18px);
            font-style: italic;
            color: var(--text-secondary);
            opacity: 0.7;
            margin-top: 40px;
            line-height: 1.8;
        }

        .kv-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 48px;
            padding: 16px 40px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--bg-primary);
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }

        .kv-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3), 0 0 60px rgba(124, 58, 237, 0.15);
            filter: brightness(1.1);
        }

        .kv-btn:active { transform: translateY(0); }

        .kv-meta {
            margin-top: 36px;
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.5;
            letter-spacing: 1px;
        }

        .kv-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .kv-theme-toggle:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.15);
        }

        /* ========== 三栏主布局 ========== */
        #main-layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }

        /* 左侧导航 260px */
        .sidebar-left {
            width: 260px;
            min-width: 260px;
            padding: 28px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            contain: layout style;
        }

        .sidebar-left::-webkit-scrollbar { width: 3px; }
        .sidebar-left::-webkit-scrollbar-track { background: transparent; }
        .sidebar-left::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.2); border-radius: 2px; }

        .logo-area { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.4;
        }
        .logo-subtitle { font-size: 11px; color: var(--text-secondary); margin-top: 4px; letter-spacing: 1px; }

        .nav-section-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            margin-top: 20px;
        }
        .nav-section-title:first-of-type { margin-top: 0; }

        .chapter-nav-item {
            padding: 9px 12px 9px 14px;
            margin-bottom: 3px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 12.5px;
            border-left: 3px solid transparent;
        }
        .chapter-nav-item:hover { background: rgba(0, 212, 255, 0.06); color: var(--text-primary); }
        .chapter-nav-item.active {
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent-blue);
            border-left-color: var(--accent-blue);
        }
        .chapter-nav-item.locked { opacity: 0.35; cursor: not-allowed; }
        .chapter-nav-item.locked:hover { background: transparent; color: var(--text-secondary); }
        .chapter-number { font-size: 9px; color: var(--accent-purple); font-weight: 700; margin-right: 5px; }

        .wiki-link {
            display: block;
            padding: 7px 12px;
            margin-bottom: 3px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12.5px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .wiki-link:hover { background: rgba(124, 58, 237, 0.06); color: var(--accent-purple); }

        .character-quick-link {
            display: block;
            padding: 7px 12px;
            margin-bottom: 3px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .character-quick-link:hover { background: rgba(245, 158, 11, 0.06); color: var(--char-akane); }

        .mode-switcher { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .mode-btn {
            width: 100%; padding: 9px 14px; margin-bottom: 6px;
            border-radius: 10px; border: 1px solid var(--glass-border);
            background: transparent; color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif; font-size: 11.5px;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px;
        }
        .mode-btn:last-child { margin-bottom: 0; }
        .mode-btn:hover { background: rgba(0, 212, 255, 0.08); border-color: rgba(0, 212, 255, 0.25); color: var(--accent-blue); }
        .mode-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(124, 58, 237, 0.12));
            border-color: var(--accent-blue); color: var(--accent-blue);
        }

        /* 中央阅读舞台 max-width: 700px */
        .reading-stage {
            flex: 1; max-width: 700px; margin: 0 auto;
            padding: 48px 36px; contain: content;
        }

        /* 章节大标题 */
        .chapter-art-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px; font-weight: 700; text-align: center;
            margin-bottom: 52px; position: relative;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .chapter-art-title::after {
            content: ''; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
        }

        /* 节标题 */
        .section-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px; font-weight: 600; color: var(--accent-blue);
            margin: 48px 0 28px 0; padding-left: 14px;
            border-left: 4px solid var(--accent-purple);
        }

        /* 场景分隔符 */
        .scene-separator {
            width: 70px; height: 2px; margin: 44px auto;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.35;
        }

        /* 引用块 */
        .art-quote {
            text-align: center; padding: 28px 36px; margin: 36px 0;
            border-left: 3px solid var(--quote-border);
            border-right: 3px solid var(--quote-border);
            background: var(--quote-bg); border-radius: 4px;
        }
        .art-quote p {
            font-style: italic; color: var(--quote-color) !important;
            font-size: 16px !important; line-height: 1.85 !important;
            margin-bottom: 6px !important;
        }

        /* 正文段落 — 直接可见，无动画 */
        .content-paragraph {
            font-family: 'Noto Serif JP', 'Source Han Serif SC', serif;
            font-size: 17px; line-height: 2.0; color: var(--text-primary);
            margin-bottom: 36px;
        }
        .content-paragraph strong { color: var(--text-primary); font-weight: 600; }
        [data-theme="light"] .content-paragraph strong { color: #0f172a; }

        /* 翻译文本 */
        .translation { font-size: 0.85em; color: var(--text-secondary); opacity: 0.65; }

        /* 对话颜色 */
        .dialogue-text { color: var(--dialogue-color); }

        /* 终端代码块 — 直接渲染，无逐行动画 */
        .terminal-block {
            background: var(--bg-tertiary); border-radius: 12px;
            margin: 32px 0; overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            contain: layout style;
        }
        [data-theme="light"] .terminal-block { background: #1a1a24; border-color: rgba(255, 255, 255, 0.06); }

        .terminal-header {
            background: rgba(25, 30, 42, 0.95);
            padding: 10px 14px; display: flex; align-items: center; gap: 7px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .terminal-dot { width: 11px; height: 11px; border-radius: 50%; }
        .terminal-dot.red { background: #ff5f57; }
        .terminal-dot.yellow { background: #febc2e; }
        .terminal-dot.green { background: #28c840; }
        .terminal-title-bar {
            flex: 1; text-align: center;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            color: rgba(148, 163, 184, 0.5); margin-left: -46px;
        }
        .terminal-body {
            padding: 18px 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px; line-height: 1.75; color: var(--terminal-green);
            white-space: pre-wrap; word-break: break-word;
        }
        .terminal-cursor {
            display: inline-block; width: 7px; height: 15px;
            background: var(--terminal-green);
            animation: cursor-blink 1s step-end infinite;
            vertical-align: middle; margin-left: 2px;
        }
        @keyframes cursor-blink { 50% { opacity: 0; } }

        /* 右侧角色栏 280px */
        .sidebar-right {
            width: 280px; min-width: 280px; padding: 28px 14px;
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
            contain: layout style;
        }
        .sidebar-right::-webkit-scrollbar { width: 3px; }
        .sidebar-right::-webkit-scrollbar-track { background: transparent; }
        .sidebar-right::-webkit-scrollbar-thumb { background: rgba(124, 58, 237, 0.2); border-radius: 2px; }

        .right-panel-title {
            font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600;
            color: var(--accent-purple); text-transform: uppercase; letter-spacing: 2px;
            margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-border);
        }

        .character-card {
            margin-bottom: 16px; padding: 16px; position: relative;
            overflow: hidden; transition: transform 0.2s ease; cursor: pointer;
        }
        .character-card:hover { transform: translateY(-3px); }
        .character-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 3px; height: 100%; background: var(--char-color); opacity: 0.8;
        }
        .char-name-jp {
            font-family: 'Noto Serif JP', serif; font-size: 16px; font-weight: 700;
            color: var(--char-color); margin-bottom: 2px;
        }
        .char-name-cn { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
        .char-role {
            display: inline-block; font-size: 10px; padding: 2px 9px; border-radius: 20px;
            background: rgba(124, 58, 237, 0.12); color: var(--accent-purple);
            margin-bottom: 10px; font-weight: 500;
        }
        [data-theme="light"] .char-role { background: rgba(220, 38, 38, 0.07); }
        .char-description { font-size: 11.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
        .char-info-list { list-style: none; padding: 0; }
        .char-info-item {
            font-size: 10.5px; color: var(--text-secondary); opacity: 0.75;
            padding: 3px 0; padding-left: 12px; position: relative; line-height: 1.5;
        }
        .char-info-item::before { content: '▸'; position: absolute; left: 0; color: var(--accent-blue); font-size: 9px; }

        .emotion-indicator { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--glass-border); }
        .emotion-label { font-size: 9px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .emotion-bar { height: 3px; background: rgba(255, 255, 255, 0.05); border-radius: 2px; overflow: hidden; }
        .emotion-fill { height: 100%; background: var(--char-color); border-radius: 2px; }

        /* ========== 视觉小说模式覆盖层 ========== */
        #vn-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1000; display: none;
            background: var(--bg-primary);
            flex-direction: column;
        }
        #vn-overlay.active { display: flex; }

        /* VN 工具栏 */
        .vn-toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            contain: layout style;
        }
        .vn-toolbar-btn {
            padding: 7px 14px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: transparent; color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif; font-size: 11.5px;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap;
        }
        .vn-toolbar-btn:hover { background: rgba(0, 212, 255, 0.1); border-color: var(--accent-blue); color: var(--accent-blue); }
        .vn-toolbar-btn.active-state { background: rgba(0, 212, 255, 0.12); border-color: var(--accent-blue); color: var(--accent-blue); }

        .vn-spacer { flex: 1; }

        /* VN 角色立绘占位区 */
        .vn-character-area {
            flex: 1; display: flex; align-items: flex-end; justify-content: center;
            padding: 20px 60px 0; position: relative;
            overflow: hidden;
        }
        .vn-placeholder-line {
            width: 200px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.15;
        }

        /* VN 对话框 */
        .vn-dialog-container {
            padding: 0 32px 28px; display: flex; flex-direction: column; align-items: stretch;
        }
        .vn-name-tag {
            display: inline-block; align-self: flex-start;
            padding: 7px 18px; margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid var(--glass-border); border-radius: 8px;
            font-family: 'Noto Serif JP', serif; font-size: 14px;
            color: var(--accent-blue); font-weight: 600;
        }
        [data-theme="light"] .vn-name-tag { background: rgba(255, 255, 255, 0.9); }

        .vn-dialog-box {
            padding: 22px 28px;
            background: rgba(10, 12, 20, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            min-height: 80px;
            display: flex; align-items: center;
            contain: layout style;
        }
        [data-theme="light"] .vn-dialog-box { background: rgba(255, 255, 255, 0.95); }

        .vn-dialog-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 17px; line-height: 1.85; color: var(--text-primary);
            flex: 1;
        }

        .vn-advance-btn {
            position: absolute; right: 20px; bottom: 16px;
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--glass-border); background: transparent;
            color: var(--text-secondary); font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .vn-advance-btn:hover { background: rgba(0, 212, 255, 0.12); border-color: var(--accent-blue); color: var(--accent-blue); }

        /* VN 历史侧栏 */
        #vn-history-sidebar {
            position: fixed; top: 0; right: -380px; width: 360px; height: 100vh;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid var(--glass-border);
            z-index: 1010; transition: right 0.3s ease;
            display: flex; flex-direction: column; contain: layout style;
        }
        #vn-history-sidebar.open { right: 0; }
        .vn-history-header {
            padding: 16px 20px; border-bottom: 1px solid var(--glass-border);
            font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700;
            color: var(--accent-blue); display: flex; justify-content: space-between; align-items: center;
        }
        .vn-history-close {
            width: 28px; height: 28px; border-radius: 6px; border: none;
            background: transparent; color: var(--text-secondary); cursor: pointer;
            font-size: 16px; display: flex; align-items: center; justify-content: center;
        }
        .vn-history-close:hover { background: rgba(255, 100, 100, 0.1); color: #ff6b6b; }
        .vn-history-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .vn-history-item {
            padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
            font-size: 13px; line-height: 1.6; color: var(--text-secondary);
            border-left: 3px solid var(--accent-purple); opacity: 0.7;
        }
        .vn-history-speaker { font-size: 10px; color: var(--accent-blue); font-weight: 600; margin-bottom: 2px; }

        /* ========== 响应式 ========== */
        @media (max-width: 1279px) and (min-width: 768px) {
            .sidebar-right { display: none; }
            .reading-stage { padding: 40px 28px; }
        }

        @media (max-width: 767px) {
            .sidebar-left {
                position: fixed; left: -280px; top: 0; z-index: 999;
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
                height: 100vh;
            }
            .sidebar-left.mobile-open { left: 0; }
            .mobile-overlay {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.55); z-index: 998; display: none;
            }

    <script>
    (function() {
        'use strict';

        // ================================================================
        // 全局状态
        // ================================================================
        const State = {
            theme: 'dark',
            isVnMode: false,
            parsedData: null,
            metaData: null,
            vnQueue: [],
            vnIndex: 0,
            vnAutoTimer: null,
            vnAutoOn: false,
            vnSpeed: 3000,
            vnTyping: false,
            vnHistory: [],
            kvVisible: true
        };

        // ================================================================
        // KV 粒子系统（≤8粒子，无交互，无连线）
        // ================================================================
        const KVParticles = (function() {
            let canvas, ctx, particles, rafId;
            const COLORS = [
                [0, 212, 255],
                [124, 58, 237],
                [255, 255, 255]
            ];

            function init() {
                canvas = document.getElementById('kv-canvas');
                if (!canvas) return;
                ctx = canvas.getContext('2d');
                resize();
                createParticles();
                animate();
                window.addEventListener('resize', resize);
            }

            function resize() {
                if (!canvas) return;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                const count = Math.min(8, Math.floor(window.innerWidth / 180));
                for (let i = 0; i < count; i++) {
                    const c = COLORS[i % COLORS.length];
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.18,
                        vy: (Math.random() - 0.5) * 0.18,
                        r: Math.random() * 1.5 + 0.5,
                        a: Math.random() * 0.25 + 0.05,
                        c: c
                    });
                }
            }

            function animate() {
                if (!ctx || !particles) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < -10) p.x = canvas.width + 10;
                    if (p.x > canvas.width + 10) p.x = -10;
                    if (p.y < -10) p.y = canvas.height + 10;
                    if (p.y > canvas.height + 10) p.y = -10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + p.a + ')';
                    ctx.fill();
                }
                rafId = requestAnimationFrame(animate);
            }

            function stop() {
                if (rafId) cancelAnimationFrame(rafId);
                if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            return { init, stop };
        })();

        // ================================================================
        // Markdown 解析引擎
        // ================================================================
        const MDParser = (function() {
            function parse(text) {
                const lines = text.split('\n');
                const result = [];
                let i = 0;

                while (i < lines.length) {
                    const raw = lines[i];
                    const trimmed = raw.trim();

                    if (!trimmed) { i++; continue; }

                    // HIDE 标记跳过
                    if (trimmed.startsWith('<!--HIDE') || trimmed.startsWith('HIDE')) {
                        while (i < lines.length && !lines[i].trim().includes('-->')) i++;
                        i++;
                        continue;
                    }

                    // 大标题 #
                    if (/^# /.test(trimmed) && !/^##/.test(trimmed)) {
                        result.push({ type: 'chapter-title', content: trimmed.slice(2).trim() });
                        i++; continue;
                    }

                    // 节标题 ##
                    if (/^## /.test(trimmed)) {
                        result.push({ type: 'section-heading', content: trimmed.slice(3).trim() });
                        i++; continue;
                    }

                    // 分隔线 --- 或 ***
                    if (trimmed === '---' || trimmed === '***' || trimmed === '****') {
                        result.push({ type: 'separator' });
                        i++; continue;
                    }

                    // 引用块 >
                    if (trimmed.startsWith('>')) {
                        let q = '';
                        while (i < lines.length && lines[i].trim().startsWith('>')) {
                            q += lines[i].trim().slice(1).trim() + '\n';
                            i++;
                        }
                        result.push({ type: 'quote', content: q.trim() });
                        continue;
                    }

                    // 代码块 ```
                    if (trimmed.startsWith('```')) {
                        const lang = trimmed.slice(3).trim().toLowerCase();
                        let code = '';
                        i++;
                        while (i < lines.length && !lines[i].trim().startsWith('```')) {
                            code += lines[i] + '\n';
                            i++;
                        }
                        i++;
                        // 终端判断：内容含 > 提示符 或 无语言标记
                        const isTerminal = code.includes('> ') || lang === '' || lang === 'bash' || lang === 'shell' || lang === 'terminal';
                        result.push({ type: isTerminal ? 'terminal' : 'codeblock', content: code.trim(), lang });
                        continue;
                    }

                    // 普通段落
                    let para = '';
                    while (i < lines.length) {
                        const tl = lines[i].trim();
                        if (!tl || /^#{1,2} /.test(tl) || tl === '---' || tl === '***' || tl.startsWith('>') || tl.startsWith('```')) break;
                        para += (para ? ' ' : '') + tl;
                        i++;
                    }
                    if (para) {
                        result.push({ type: 'paragraph', content: para });
                    } else {
                        i++;
                    }
                }
                return result;
            }

            function inline(text) {
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/（([^）]+)）/g, '<span class="translation">（$1）</span>');
                text = text.replace(/「([^」]+)」/g, '<span class="dialogue-text">「$1」</span>');
                return text;
            }

            return { parse, inline };
        })();

        // ================================================================
        // 渲染器
        // ================================================================
        const Renderer = (function() {
            function render(data, containerId) {
                const c = document.getElementById(containerId);
                if (!c) return;
                let html = '';
                data.forEach(item => {
                    html += buildElement(item);
                });
                c.innerHTML = html;
            }

            function escapeHTML(s) {
                const d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function buildElement(item) {
                switch (item.type) {
                    case 'chapter-title':
                        return `<div class="chapter-art-title" id="ch-prologue">${escapeHTML(item.content)}</div>`;

                    case 'section-heading':
                        return `<h2 class="section-heading">${escapeHTML(item.content)}</h2>`;

                    case 'separator':
                        return `<div class="scene-separator"></div>`;

                    case 'quote': {
                        const lines = item.content.split('\n').filter(l => l.trim());
                        let ps = '';
                        lines.forEach(l => { ps += `<p>${MDParser.inline(l)}</p>`; });
                        return `<blockquote class="art-quote">${ps}</blockquote>`;
                    }

                    case 'terminal': {
                        const esc = escapeHTML(item.content);
                        return `<div class="terminal-block"><div class="terminal-header"><span class="terminal-dot red"></span><span class="terminal-dot yellow"></span><span class="terminal-dot green"></span><span class="terminal-title-bar">terminal@phantasm ~ %</span></div><div class="terminal-body">${esc}<span class="terminal-cursor"></span></div></div>`;
                    }

                    case 'codeblock': {
                        const esc = escapeHTML(item.content);
                        return `<div class="terminal-block"><div class="terminal-header"><span class="terminal-dot red"></span><span class="terminal-dot yellow"></span><span class="terminal-dot green"></span><span class="terminal-title-bar">${escapeHTML(item.lang || 'code')}</span></div><div class="terminal-body">${esc}</div></div>`;
                    }

                    case 'paragraph':
                        return `<p class="content-paragraph">${MDParser.inline(item.content)}</p>`;

                    default:
                        return '';
                }
            }

            return { render };
        })();

        // ================================================================
        // 角色卡片渲染
        // ================================================================
        const CharRenderer = (function() {
            const COLOR_MAP = {
                '零': '#00d4ff', '朱音': '#f59e0b', '小雪': '#38bdf8', 'Eve': '#a855f7'
            };

            function getColor(name) {
                for (const [k, v] of Object.entries(COLOR_MAP)) {
                    if (name.includes(k)) return v;
                }
                return '#00d4ff';
            }

            function render(chars) {
                const container = document.getElementById('character-cards');
                const quickNav = document.getElementById('character-quick-nav');

                if (!chars || !chars.length) {
                    if (container) container.innerHTML = '<p style="color:var(--text-secondary);font-size:12px;padding:10px;">暂无角色数据</p>';
                    if (quickNav) quickNav.innerHTML = '<p style="color:var(--text-secondary);font-size:11px;">—</p>';
                    return;
                }
                if (container) container.innerHTML = '';
                if (quickNav) quickNav.innerHTML = '';

                chars.forEach((ch, idx) => {
                    const color = getColor(ch.name_jp || ch.name || '');
                    const glow = color.replace('#', '');

                    if (container) {
                        const card = document.createElement('div');
                        card.className = 'character-card glass-panel';
                        card.id = 'char-card-' + idx;
                        card.style.setProperty('--char-color', color);

                        let infoHtml = '';
                        if (ch.new_info_revealed && ch.new_info_revealed.length > 0) {
                            infoHtml = '<ul class="char-info-list">' +
                                ch.new_info_revealed.slice(0, 3).map(info =>
                                    `<li class="char-info-item">${info}</li>`
                                ).join('') + '</ul>';
                        }

                        card.innerHTML =
                            '<div class="char-name-jp">' + (ch.name_jp || ch.name || '未知') + '</div>' +
                            '<div class="char-name-cn">' + (ch.name_cn || '') + '</div>' +
                            '<div class="char-role">' + (ch.role || '') + '</div>' +
                            '<div class="char-description">' + (ch.description || '') + '</div>' +
                            infoHtml +
                            '<div class="emotion-indicator"><div class="emotion-label">情绪波动</div><div class="emotion-bar"><div class="emotion-fill" style="width:' + (Math.random() * 35 + 30) + '%"></div></div></div>';

                        container.appendChild(card);
                    }

                    if (quickNav) {
                        const link = document.createElement('div');
                        link.className = 'character-quick-link';
                        link.textContent = '• ' + (ch.name_jp || ch.name);
                        link.onclick = function() {
                            const el = document.getElementById('char-card-' + idx);
                            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        };
                        quickNav.appendChild(link);
                    }
                });
            }

            return { render };
        })();

        // ================================================================
        // 视觉小说控制器
        // ================================================================
        const VNController = (function() {
            const overlay = document.getElementById('vn-overlay');
            const nameTag = document.getElementById('vn-name-tag');
            const dialogText = document.getElementById('vn-dialog-text');
            const dialogBox = document.getElementById('vn-dialog-box');
            const advanceBtn = document.getElementById('vn-advance-btn');
            const counterEl = document.getElementById('vn-counter');
            const historySidebar = document.getElementById('vn-history-sidebar');
            const historyList = document.getElementById('vn-history-list');

            function extractDialogs(parsedData) {
                const queue = [];
                parsedData.forEach(function(item) {
                    if (item.type !== 'paragraph') return;
                    const text = item.content;
                    // 匹配对话：「...」
                    const dm = text.match(/^([^「]*?)「(.+)」/);
                    if (dm) {
                        queue.push({
                            speaker: dm[1] ? dm[1].trim() : '',
                            text: dm[2]
                        });
                    } else {
                        // 叙述文本截取前120字
                        const short = text.length > 120 ? text.substring(0, 120) + '…' : text;
                        queue.push({ speaker: '', text: short });
                    }
                });
                return queue;
            }

            function showCurrent() {
                if (State.vnIndex >= State.vnQueue.length) {
                    State.vnIndex = 0;
                }
                const d = State.vnQueue[State.vnIndex];
                if (!d) return;

                if (d.speaker) {
                    nameTag.textContent = d.speaker;
                    nameTag.style.display = 'inline-block';
                } else {
                    nameTag.style.display = 'none';
                }

                updateCounter();
                typewriter(d.text);

                // 记录历史
                State.vnHistory.push({ speaker: d.speaker || '旁白', text: d.text });
                if (State.vnHistory.length > 100) State.vnHistory.shift();
            }

            function typewriter(text) {
                State.vnTyping = true;
                dialogText.innerHTML = '';
                let i = 0;
                const speed = 22;

                function tick() {
                    if (!State.isVnMode) { State.vnTyping = false; return; }
                    if (i < text.length) {
                        dialogText.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(tick, speed);
                    } else {
                        State.vnTyping = false;
                    }
                }
                tick();
            }

            function instantShow(text) {
                State.vnTyping = false;
                dialogText.innerHTML = text;
            }

            function advance() {
                // 如果正在打字，瞬间显示完
                if (State.vnTyping) {
                    const d = State.vnQueue[State.vnIndex];
                    if (d) instantShow(d.text);
                    return;
                }
                State.vnIndex++;
                showCurrent();
            }

            function skip() {
                // 快速跳到下一段（瞬间显示当前，再推进）
                if (State.vnTyping) {
                    const d = State.vnQueue[State.vnIndex];
                    if (d) instantShow(d.text);
                }
                State.vnIndex++;
                if (State.vnIndex >= State.vnQueue.length) State.vnIndex = 0;
                showCurrent();
            }

            function reset() {
                stopAuto();
                State.vnIndex = 0;
                State.vnHistory = [];
                showCurrent();
                renderHistory();
            }

            function toggleAuto() {
                if (State.vnAutoOn) {
                    stopAuto();
                } else {
                    startAuto();
                }
            }

            function startAuto() {
                State.vnAutoOn = true;
                const btn = document.getElementById('vn-btn-auto');
                if (btn) btn.classList.add('active-state');
                function tick() {
                    if (!State.vnAutoOn || !State.isVnMode) return;
                    advance();
                    State.vnAutoTimer = setTimeout(tick, State.vnSpeed);
                }
                tick();
            }

            function stopAuto() {
                State.vnAutoOn = false;
                if (State.vnAutoTimer) { clearTimeout(State.vnAutoTimer); State.vnAutoTimer = null; }
                const btn = document.getElementById('vn-btn-auto');
                if (btn) btn.classList.remove('active-state');
            }

            function toggleHistory() {
                historySidebar.classList.toggle('open');
                renderHistory();
            }

            function closeHistory() {
                historySidebar.classList.remove('open');
            }

            function renderHistory() {
                if (!historyList) return;
                let h = '';
                // 从最新往前显示
                for (let i = State.vnHistory.length - 1; i >= Math.max(0, State.vnHistory.length - 50); i--) {
                    const item = State.vnHistory[i];
                    h += '<div class="vn-history-item"><div class="vn-history-speaker">' + item.speaker + '</div>' + item.text + '</div>';
                }
                historyList.innerHTML = h || '<p style="padding:20px;text-align:center;color:var(--text-secondary);font-size:12px;">暂无历史记录</p>';
            }

            function updateCounter() {
                if (counterEl) {
                    counterEl.textContent = (State.vnIndex + 1) + ' / ' + State.vnQueue.length;
                }
            }

            function activate(parsedData) {
                State.vnQueue = extractDialogs(parsedData);
                State.vnIndex = 0;
                State.vnHistory = [];
                updateCounter();
                showCurrent();
            }

            function enterMode() {
                State.isVnMode = true;
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';

                const btnVn = document.getElementById('btn-vn-mode');
                const btnFic = document.getElementById('btn-fiction-mode');
                if (btnVn) btnVn.classList.add('active');
                if (btnFic) btnFic.classList.remove('active');
            }

            function exitMode() {
                State.isVnMode = false;
                State.vnTyping = false;
                stopAuto();
                overlay.classList.remove('active');
                closeHistory();
                document.body.style.overflow = '';

                const btnVn = document.getElementById('btn-vn-mode');
                const btnFic = document.getElementById('btn-fiction-mode');
                if (btnFic) btnFic.classList.add('active');
                if (btnVn) btnVn.classList.remove('active');
            }

            function bindEvents() {
                // 工具栏按钮
                document.getElementById('vn-btn-back').addEventListener('click', exitMode);
                document.getElementById('vn-btn-history').addEventListener('click', toggleHistory);
                document.getElementById('vn-btn-skip').addEventListener('click', skip);
                document.getElementById('vn-btn-auto').addEventListener('click', toggleAuto);
                document.getElementById('vn-btn-reset').addEventListener('click', reset);
                document.getElementById('vn-history-close').addEventListener('click', closeHistory);

                // 推进：对话框点击 + ▶按钮
                dialogBox.addEventListener('click', advance);
                advanceBtn.addEventListener('click', function(e) { e.stopPropagation(); advance(); });

                // 键盘 → 推进
                document.addEventListener('keydown', function(e) {
                    if (!State.isVnMode) return;
                    if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        advance();
                    }
                });
            }

            return { activate, enterMode, exitMode, bindEvents };
        })();

        // ================================================================
        // 主题切换
        // ================================================================
        function setTheme(theme) {
            State.theme = theme;
            const root = document.documentElement;
            const kvBtn = document.getElementById('kv-theme-btn');
            const darkBtn = document.getElementById('btn-theme-dark');
            const lightBtn = document.getElementById('btn-theme-light');

            if (theme === 'light') {
                root.setAttribute('data-theme', 'light');
                if (kvBtn) kvBtn.textContent = '☀️';
                if (darkBtn) darkBtn.classList.remove('active');
                if (lightBtn) lightBtn.classList.add('active');
            } else {
                root.removeAttribute('data-theme');
                if (kvBtn) kvBtn.textContent = '🌙';
                if (darkBtn) darkBtn.classList.add('active');
                if (lightBtn) lightBtn.classList.remove('active');
            }
        }

        function toggleTheme() {
            setTheme(State.theme === 'dark' ? 'light' : 'dark');
        }

        // ================================================================
        // KV 区交互
        // ================================================================
        function setupKV() {
            const startBtn = document.getElementById('kv-start-btn');
            const themeBtn = document.getElementById('kv-theme-btn');

            if (startBtn) {
                startBtn.addEventListener('click', function() {
                    const mainLayout = document.getElementById('main-layout');
                    if (mainLayout) {
                        mainLayout.scrollIntoView({ behavior: 'smooth' });
                    }
                    State.kvVisible = false;
                    // 可选：折叠KV区以节省空间
                    const kvSec = document.getElementById('kv-section');
                    if (kvSec) {
                        kvSec.style.minHeight = '0';
                        kvSec.style.paddingBottom = '0';
                    }
                });
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', toggleTheme);
            }
        }

        // ================================================================
        // 模式切换
        // ================================================================
        function bindModeSwitch() {
            const btnFiction = document.getElementById('btn-fiction-mode');
            const btnVN = document.getElementById('btn-vn-mode');

            if (btnVN) {
                btnVN.addEventListener('click', function() {
                    if (State.parsedData) {
                        VNController.activate(State.parsedData);
                    }
                    VNController.enterMode();
                });
            }

            if (btnFiction) {
                btnFiction.addEventListener('click', function() {
                    VNController.exitMode();
                });
            }
        }

        // ================================================================
        // 移动端菜单
        // ================================================================
        function bindMobileMenu() {
            const ham = document.getElementById('hamburger-btn');
            const sidebar = document.getElementById('sidebar-left');
            const overlay = document.getElementById('mobile-overlay');

            if (!ham || !sidebar) return;

            function open() {
                sidebar.classList.add('mobile-open');
                if (overlay) overlay.classList.add('active');
            }
            function close() {
                sidebar.classList.remove('mobile-open');
                if (overlay) overlay.classList.remove('active');
            }

            ham.addEventListener('click', open);
            if (overlay) overlay.addEventListener('click', close);
        }

        // ================================================================
        // 章节导航锚点
        // ================================================================
        function bindChapterNav() {
            const items = document.querySelectorAll('.chapter-nav-item:not(.locked)');
            items.forEach(function(item) {
                item.addEventListener('click', function() {
                    const anchor = this.getAttribute('data-anchor');
                    if (anchor) {
                        const el = document.getElementById(anchor);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }
                    // 更新激活状态
                    items.forEach(function(i) { i.classList.remove('active'); });
                    this.classList.add('active');
                });
            });
        }

        // ================================================================
        // 初始化主流程
        // ================================================================
        async function init() {
            // 启动KV粒子系统
            KVParticles.init();
            setupKV();

            try {
                const [mdRes, jsonRes] = await Promise.all([
                    fetch('chapter_01/chapter_01.md'),
                    fetch('chapter_01/chapter_01_meta.json')
                ]);

                if (!mdRes.ok) throw new Error('无法加载章节文件 chapter_01.md');
                if (!jsonRes.ok) throw new Error('无法加载元数据 chapter_01_meta.json');

                const mdText = await mdRes.text();
                const jsonData = await jsonRes.json();

                State.metaData = jsonData;

                // 解析 Markdown
                State.parsedData = MDParser.parse(mdText);

                // 渲染中央阅读区（一次性全部渲染，无动画）
                Renderer.render(State.parsedData, 'reading-stage');

                // 渲染右侧角色卡片
                if (jsonData.characters_appeared) {
                    CharRenderer.render(jsonData.characters_appeared);
                }

                // 绑定事件
                bindModeSwitch();
                bindMobileMenu();
                bindChapterNav();
                VNController.bindEvents();

                // 主题按钮（左侧面板内的）
                // 在 mode-switcher 区域添加主题切换
                const modeSwitcher = document.querySelector('.mode-switcher');
                if (modeSwitcher) {
                    const themeDiv = document.createElement('div');
                    themeDiv.style.cssText = 'margin-top:12px;display:flex;gap:5px;';
                    themeDiv.innerHTML =
                        '<button class="mode-btn active" id="btn-theme-dark" style="flex:1;font-size:10px;">🌙 深色</button>' +
                        '<button class="mode-btn" id="btn-theme-light" style="flex:1;font-size:10px;">☀️ 浅色</button>';
                    modeSwitcher.parentNode.insertBefore(themeDiv, modeSwitcher.nextSibling);

                    document.getElementById('btn-theme-dark').addEventListener('click', function() { setTheme('dark'); });
                    document.getElementById('btn-theme-light').addEventListener('click', function() { setTheme('light'); });
                }

            } catch (err) {
                console.error('初始化失败:', err);
                const stage = document.getElementById('reading-stage');
                if (stage) {
                    stage.innerHTML =
                        '<div style="text-align:center;padding:80px 20px;font-family:' + "'Space Grotesk'" + ',sans-serif;">' +
                        '<div style="font-size:24px;color:#ff5f57;margin-bottom:16px;">⚠ 加载错误</div>' +
                        '<div style="color:var(--text-secondary);font-size:14px;line-height:1.8;">' +
                        err.message + '<br><br>' +
                        '<span style="font-size:12px;opacity:0.6;">请通过 HTTP 服务器运行此页面<br>例如: python -m http.server 8080<br>然后访问 http://localhost:8080</span>' +
                        '</div></div>';
                }
            }
        }

        // 启动
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
