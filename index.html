<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端之梦 Terminal Phantasm - Narrative Operating System</title>

    <!-- Google Fonts 预连接 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- TailwindCSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ==================== 基础重置与变量 ==================== */
        /* ==================== 主题变量 ==================== */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-tertiary: #1a2035;
            --accent-blue: #00d4ff;
            --accent-purple: #7c3aed;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --terminal-green: #00ff88;
            --character-akane: #f59e0b;
            --character-koyuki: #38bdf8;
            --character-zero: #00d4ff;
            --character-eve: #a855f7;
            --glass-bg: rgba(15, 20, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --quote-color: rgba(245, 158, 11, 0.85);
            --quote-bg: rgba(245, 158, 11, 0.03);
            --quote-border: rgba(245, 158, 11, 0.4);
            --dialogue-color: #f0e6d3;
            --particle-colors: 'rgba(0,212,255,', 'rgba(124,58,237,', 'rgba(255,255,255,';
            --particle-line: 0, 212, 255;
        }

        /* 白色主色调 + 红色副色调 */
        [data-theme="light"] {
            --bg-primary: #fafafa;
            --bg-secondary: #f0f0f2;
            --bg-tertiary: #e8e8ec;
            --accent-blue: #dc2626;
            --accent-purple: #b91c1c;
            --text-primary: #1a1a2e;
            --text-secondary: #555570;
            --terminal-green: #16a34a;
            --character-akane: #dc2626;
            --character-koyuki: #2563eb;
            --character-zero: #dc2626;
            --character-eve: #9333ea;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(0, 0, 0, 0.08);
            --quote-color: rgba(185, 28, 28, 0.85);
            --quote-bg: rgba(220, 38, 38, 0.04);
            --quote-border: rgba(220, 38, 38, 0.35);
            --dialogue-color: #2d1810;
            --particle-colors: 'rgba(220,38,38,', 'rgba(185,28,28,', 'rgba(100,100,100,';
            --particle-line: 220, 38, 38;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ==================== Liquid Glass 面板 ==================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        /* ==================== 粒子画布层 ==================== */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ==================== Loading 屏幕 ==================== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
            letter-spacing: 4px;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 40px rgba(124, 58, 237, 0.6)); }
        }

        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            color: var(--terminal-green);
            font-size: 14px;
            letter-spacing: 2px;
        }

        .loading-cursor {
            display: inline-block;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ==================== 主布局容器 ==================== */
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==================== 左侧导航栏 (280px) ==================== */
        .sidebar-left {
            width: 280px;
            min-width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar-left::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-left::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-left::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.2);
            border-radius: 2px;
        }

        /* Logo 区域 */
        .logo-area {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* 导航区块标题 */
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .nav-section-title:first-of-type {
            margin-top: 0;
        }

        /* 章节导航项 */
        .chapter-nav-item {
            position: relative;
            padding: 10px 12px 10px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-secondary);
            font-size: 13px;
            border-left: 3px solid transparent;
        }

        .chapter-nav-item:hover {
            background: rgba(0, 212, 255, 0.08);
            color: var(--text-primary);
        }

        .chapter-nav-item.active {
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent-blue);
            border-left-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }

        .chapter-nav-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .chapter-nav-item.locked:hover {
            background: transparent;
            color: var(--text-secondary);
        }

        .chapter-number {
            font-size: 10px;
            color: var(--accent-purple);
            font-weight: 600;
            margin-right: 6px;
        }

        /* 世界观索引链接 */
        .wiki-link {
            display: block;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .wiki-link:hover {
            background: rgba(124, 58, 237, 0.08);
            color: var(--accent-purple);
        }

        /* 角色速览列表 */
        .character-quick-link {
            display: block;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .character-quick-link:hover {
            background: rgba(245, 158, 11, 0.08);
            color: var(--character-akane);
        }

        /* 模式切换按钮组 */
        .mode-switcher {
            margin-top: auto;
            padding-top: 24px;
            border-top: 1px solid var(--glass-border);
        }

        .mode-btn {
            width: 100%;
            padding: 10px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .mode-btn:last-child {
            margin-bottom: 0;
        }

        .mode-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(124, 58, 237, 0.15));
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        /* 主题切换按钮组 */
        .theme-switcher {
            margin-top: 12px;
            display: flex;
            gap: 6px;
        }

        .theme-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-secondary);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .theme-btn:hover {
            background: rgba(0, 212, 255, 0.08);
            color: var(--text-primary);
        }

        .theme-btn.active {
            background: rgba(220, 38, 38, 0.12);
            border-color: rgba(220, 38, 38, 0.3);
            color: #dc2626;
        }

        /* ==================== 中央阅读舞台 ==================== */
        .reading-stage {
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 48px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 章节艺术大标题 */
        .chapter-art-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradient-shift 4s linear infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .chapter-art-title::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
        }

        /* 节标题 */
        .section-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--accent-blue);
            margin: 56px 0 32px 0;
            padding-left: 16px;
            border-left: 4px solid var(--accent-purple);
            position: relative;
        }

        .section-heading::before {
            content: attr(data-number);
            position: absolute;
            right: 0;
            top: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            font-weight: 900;
            color: rgba(124, 58, 237, 0.06);
            line-height: 1;
        }

        /* 场景分隔符 */
        .scene-separator {
            width: 80px;
            height: 2px;
            margin: 48px auto;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.4;
        }

        /* 艺术格言/引用块 */
        .art-quote {
            text-align: center;
            padding: 32px 40px;
            margin: 40px 0;
            border-left: 3px solid var(--quote-border);
            border-right: 3px solid var(--quote-border);
            background: var(--quote-bg);
            border-radius: 4px;
        }

        .art-quote p {
            font-style: italic;
            color: var(--quote-color) !important;
            font-size: 17px !important;
            line-height: 1.9 !important;
            margin-bottom: 8px !important;
        }

        /* 正文段落 */
        .content-paragraph {
            font-family: 'Noto Serif JP', 'Source Han Serif SC', serif;
            font-size: 18px;
            line-height: 2.0;
            color: var(--text-primary);
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .content-paragraph.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content-paragraph strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        [data-theme="light"] .content-paragraph strong {
            color: #0f172a;
        }

        /* 中文翻译样式 */
        .translation {
            font-size: 0.85em;
            color: rgba(148, 163, 184, 0.6);
        }

        /* 对话符号微调 */
        .dialogue-text {
            color: var(--dialogue-color);
        }

        /* 首段缩进效果（仅首段微微不同，不放大首字） */
        .content-paragraph:first-of-type {
            text-indent: 0;
        }

        /* 终端代码块 */
        .terminal-block {
            background: var(--bg-tertiary);
            border-radius: 12px;
            margin: 36px 0;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.15);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .terminal-block {
            background: #1e1e2e;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .terminal-header {
            background: rgba(30, 35, 45, 0.95);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-dot.red { background: #ff5f57; }
        .terminal-dot.yellow { background: #febc2e; }
        .terminal-dot.green { background: #28c840; }

        .terminal-title-bar {
            flex: 1;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.6);
            margin-left: -52px;
        }

        .terminal-body {
            padding: 20px 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.8;
            color: var(--terminal-green);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-line {
            opacity: 0;
            animation: terminal-type 0.15s ease forwards;
        }

        @keyframes terminal-type {
            to { opacity: 1; }
        }

        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--terminal-green);
            animation: cursor-blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes cursor-blink {
            50% { opacity: 0; }
        }

        /* ==================== 右侧角色空间 (300px) ==================== */
        .sidebar-right {
            width: 300px;
            min-width: 300px;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 24px 16px;
            overflow-y: auto;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar-right::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-right::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-right::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.2);
            border-radius: 2px;
        }

        .right-panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        /* 角色卡片 */
        .character-card {
            margin-bottom: 20px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .character-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--char-glow);
        }

        .character-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--char-color);
            opacity: 0.8;
        }

        .character-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--char-glow) 0%, transparent 70%);
            opacity: 0.06;
            pointer-events: none;
        }

        .char-name-jp {
            font-family: 'Noto Serif JP', serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--char-color);
            margin-bottom: 4px;
        }

        .char-name-cn {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .char-role {
            display: inline-block;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent-purple);
            margin-bottom: 12px;
            font-weight: 500;
        }

        [data-theme="light"] .char-role {
            background: rgba(220, 38, 38, 0.08);
        }

        .char-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .char-tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }

        .char-description {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .char-info-list {
            list-style: none;
            padding: 0;
        }

        .char-info-item {
            font-size: 11px;
            color: rgba(148, 163, 184, 0.8);
            padding: 4px 0;
            padding-left: 14px;
            position: relative;
            line-height: 1.5;
        }

        .char-info-item::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent-blue);
            font-size: 10px;
        }

        /* 情绪指示器 */
        .emotion-indicator {
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .emotion-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .emotion-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
        }

        .emotion-fill {
            height: 100%;
            background: var(--char-color);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        /* ==================== 视觉小说模式 ==================== */
        .vn-mode .sidebar-left,
        .vn-mode .sidebar-right {
            width: 0;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            opacity: 0;
        }

        .vn-mode .reading-stage {
            max-width: 100%;
            padding: 20px;
        }

        .vn-dialog-box {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            padding: 20px 40px;
            display: none;
            align-items: center;
            z-index: 100;
        }

        [data-theme="light"] .vn-dialog-box {
            background: rgba(255, 255, 255, 0.92);
            border-top-color: rgba(220, 38, 38, 0.15);
        }

        .vn-mode .vn-dialog-box {
            display: flex;
        }

        .vn-name-tag {
            position: absolute;
            bottom: 120px;
            left: 40px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: 14px;
            color: var(--accent-blue);
            font-weight: 600;
        }

        [data-theme="light"] .vn-name-tag {
            background: rgba(255, 255, 255, 0.85);
        }

        .vn-dialog-text {
            font-family: 'Noto Serif JP', serif;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
            max-width: 900px;
        }

        .vn-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;

    <script>
        // ================================================================
        // 全局状态管理
        // ================================================================
        const AppState = {
            currentMode: 'fiction',
            isVnMode: false,
            chapterData: null,
            metaData: null,
            vnDialogQueue: [],
            vnCurrentIndex: 0
        };

        // ================================================================
        // 粒子系统（轻量优化版）
        // ================================================================
        class ParticleSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                this.init();
                window.addEventListener('resize', () => this.resize());
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                const count = window.innerWidth < 768 ? 8 : 14;
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.25,
                        vy: (Math.random() - 0.5) * 0.25,
                        radius: Math.random() * 1.5 + 0.5,
                        alpha: Math.random() * 0.4 + 0.08
                    });
                }
            }

            animate() {
                if (!this.ctx) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                const colors = getComputedStyle(document.documentElement)
                    .getPropertyValue('--particle-colors').trim()
                    .split(',').map(s => s.trim().replace(/'/g, ''));

                this.particles.forEach((p) => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

                    const colorStr = colors[Math.floor(Math.random() * colors.length)] || 'rgba(0,212,255,';
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = colorStr + p.alpha + ')';
                    this.ctx.fill();
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        // ================================================================
        // Markdown 解析引擎
        // ================================================================
        class MarkdownParser {
            constructor() {
                this.result = [];
            }

            parse(markdownText) {
                const lines = markdownText.split('\n');
                let i = 0;

                while (i < lines.length) {
                    const line = lines[i].trim();

                    // 跳过空行
                    if (!line) {
                        i++;
                        continue;
                    }

                    // 大章标题 #
                    if (line.startsWith('# ') && !line.startsWith('## ')) {
                        this.result.push({
                            type: 'chapter-title',
                            content: line.slice(2).trim()
                        });
                        i++;
                        continue;
                    }

                    // 节标题 ##
                    if (line.startsWith('## ')) {
                        this.result.push({
                            type: 'section-heading',
                            content: line.slice(3).trim()
                        });
                        i++;
                        continue;
                    }

                    // 分隔线 ---
                    if (line === '---') {
                        this.result.push({ type: 'separator' });
                        i++;
                        continue;
                    }

                    // 引用块 >
                    if (line.startsWith('>')) {
                        let quoteContent = '';
                        while (i < lines.length && lines[i].trim().startsWith('>')) {
                            quoteContent += lines[i].trim().slice(1).trim() + '\n';
                            i++;
                        }
                        this.result.push({
                            type: 'quote',
                            content: quoteContent.trim()
                        });
                        continue;
                    }

                    // 代码块 ```
                    if (line.startsWith('```')) {
                        const codeLang = line.slice(3).trim().toLowerCase();
                        let codeContent = '';
                        i++;
                        while (i < lines.length && !lines[i].trim().startsWith('```')) {
                            codeContent += lines[i] + '\n';
                            i++;
                        }
                        i++; // 跳过结束的 ```

                        // 判断是否为终端代码块（引用内的代码块或特定语言标记）
                        const isTerminal = codeLang === '' || codeLang === 'bash' || codeLang === 'shell' || codeLang === 'terminal' || codeLang === 'console';

                        this.result.push({
                            type: isTerminal ? 'terminal' : 'codeblock',
                            content: codeContent.trim(),
                            language: codeLang
                        });
                        continue;
                    }

                    // 普通段落
                    let paragraphContent = '';
                    while (i < lines.length && lines[i].trim() !== '' && !lines[i].trim().startsWith('#') && !lines[i].trim().startsWith('---') && !lines[i].trim().startsWith('>') && !lines[i].trim().startsWith('```')) {
                        paragraphContent += (paragraphContent ? ' ' : '') + lines[i].trim();
                        i++;
                    }

                    if (paragraphContent) {
                        this.result.push({
                            type: 'paragraph',
                            content: paragraphContent
                        });
                        continue;
                    }

                    i++;
                }

                return this.result;
            }

            // 处理行内格式
            processInlineFormatting(text) {
                // 加粗 **text**
                text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

                // 中文翻译 （）→ translation span
                text = text.replace(/（([^）]+)）/g, '<span class="translation">（$1）</span>');

                // 对话符号 「」微调颜色
                text = text.replace(/「([^」]+)」/g, '<span class="dialogue-text">「$1」</span>');

                return text;
            }
        }

        // ================================================================
        // 渲染器
        // ================================================================
        class Renderer {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.parser = new MarkdownParser();
            }

            render(parsedData) {
                this.container.innerHTML = '';

                parsedData.forEach((item, index) => {
                    const element = this.createElement(item, index);
                    if (element) {
                        this.container.appendChild(element);
                    }
                });

                // 启动段落淡入观察器
                this.initScrollObserver();
            }

            createElement(item, index) {
                switch (item.type) {
                    case 'chapter-title':
                        return this.createChapterTitle(item.content);

                    case 'section-heading':
                        return this.createSectionHeading(item.content, index);

                    case 'separator':
                        return this.createSeparator();

                    case 'quote':
                        return this.createQuote(item.content);

                    case 'terminal':
                        return this.createTerminal(item.content);

                    case 'codeblock':
                        return this.createCodeBlock(item.content, item.language);

                    case 'paragraph':
                        return this.createParagraph(item.content, index);

                    default:
                        return null;
                }
            }

            createChapterTitle(text) {
                const el = document.createElement('div');
                el.className = 'chapter-art-title';
                el.textContent = text;
                return el;
            }

            createSectionHeading(text, index) {
                const el = document.createElement('h2');
                el.className = 'section-heading';
                el.textContent = text;
                el.setAttribute('data-number', String(index).padStart(2, '0'));
                return el;
            }

            createSeparator() {
                const el = document.createElement('div');
                el.className = 'scene-separator';
                return el;
            }

            createQuote(content) {
                const el = document.createElement('blockquote');
                el.className = 'art-quote';

                const paragraphs = content.split('\n').filter(p => p.trim());
                paragraphs.forEach(p => {
                    const pEl = document.createElement('p');
                    pEl.innerHTML = `<em>${this.parser.processInlineFormatting(p)}</em>`;
                    el.appendChild(pEl);
                });

                return el;
            }

            createTerminal(code) {
                const wrapper = document.createElement('div');
                wrapper.className = 'terminal-block';

                // 终端头部
                const header = document.createElement('div');
                header.className = 'terminal-header';
                header.innerHTML = `
                    <span class="terminal-dot red"></span>
                    <span class="terminal-dot yellow"></span>
                    <span class="terminal-dot green"></span>
                    <span class="terminal-title-bar">terminal@phantasm ~ %</span>
                `;
                wrapper.appendChild(header);

                // 终端内容
                const body = document.createElement('div');
                body.className = 'terminal-body';

                const lines = code.split('\n');
                lines.forEach((line, idx) => {
                    const lineEl = document.createElement('div');
                    lineEl.className = 'terminal-line';
                    lineEl.style.animationDelay = `${idx * 0.06}s`;
                    lineEl.textContent = line || '\u00A0'; // 保持空行
                    body.appendChild(lineEl);
                });

                // 光标
                const cursor = document.createElement('span');
                cursor.className = 'terminal-cursor';
                body.appendChild(cursor);

                wrapper.appendChild(body);
                return wrapper;
            }

            createCodeBlock(code, language) {
                const wrapper = document.createElement('pre');
                wrapper.className = 'terminal-block';
                wrapper.innerHTML = `
                    <div class="terminal-header">
                        <span class="terminal-dot red"></span>
                        <span class="terminal-dot yellow"></span>
                        <span class="terminal-dot green"></span>
                        <span class="terminal-title-bar">${language || 'code'}</span>
                    </div>
                    <div class="terminal-body">${this.escapeHtml(code)}</div>
                `;
                return wrapper;
            }

            createParagraph(text, index) {
                const el = document.createElement('p');
                el.className = 'content-paragraph';
                el.innerHTML = this.parser.processInlineFormatting(text);
                el.style.transitionDelay = `${index * 0.05}s`;
                return el;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            initScrollObserver() {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('visible');
                            }
                        });
                    },
                    {
                        threshold: 0.1,
                        rootMargin: '0px 0px -50px 0px'
                    }
                );

                document.querySelectorAll('.content-paragraph').forEach(el => {
                    observer.observe(el);
                });
            }
        }

        // ================================================================
        // 角色卡片渲染器
        // ================================================================
        class CharacterRenderer {
            static getCharacterColor(name) {
                const colorMap = {
                    '朱音': '#f59e0b',
                    '小雪': '#38bdf8',
                    '零': '#00d4ff',
                    'Eve': '#a855f7'
                };
                for (const [key, value] of Object.entries(colorMap)) {
                    if (name.includes(key)) return value;
                }
                return '#00d4ff'; // 默认蓝色
            }

            static renderCards(characters) {
                const container = document.getElementById('character-cards');
                const quickNav = document.getElementById('character-quick-nav');

                if (!characters || characters.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-secondary);font-size:13px;">暂无角色数据</p>';
                    quickNav.innerHTML = '<p style="color:var(--text-secondary);font-size:12px;">—</p>';
                    return;
                }

                container.innerHTML = '';
                quickNav.innerHTML = '';

                characters.forEach((char, idx) => {
                    const color = this.getCharacterColor(char.name_jp || char.name || '');
                    const glowColor = color.replace('#', '');

                    // 角色卡片
                    const card = document.createElement('div');
                    card.className = 'character-card glass-panel';
                    card.id = `char-card-${idx}`;
                    card.style.setProperty('--char-color', color);
                    card.style.setProperty('--char-glow', `#${glowColor}33`);

                    card.innerHTML = `
                        <div class="char-name-jp">${char.name_jp || char.name || '未知'}</div>
                        <div class="char-name-cn">${char.name_cn || ''}</div>
                        <div class="char-role">${char.role || ''}</div>
                        ${char.tags ? `<div class="char-tags">${char.tags.map(t => `<span class="char-tag">${t}</span>`).join('')}</div>` : ''}
                        <div class="char-description">${char.description || ''}</div>
                        ${char.new_info_revealed && char.new_info_revealed.length > 0 ? `
                            <ul class="char-info-list">
                                ${char.new_info_revealed.slice(0, 3).map(info => `<li class="char-info-item">${info}</li>`).join('')}
                            </ul>
                        ` : ''}
                        <div class="emotion-indicator">
                            <div class="emotion-label">情绪波动</div>
                            <div class="emotion-bar">
                                <div class="emotion-fill" style="width:${Math.random() * 40 + 30}%"></div>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);

                    // 快捷导航链接
                    const link = document.createElement('div');
                    link.className = 'character-quick-link';
                    link.textContent = `• ${char.name_jp || char.name}`;
                    link.onclick = () => {
                        document.getElementById(`char-card-${idx}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    };
                    quickNav.appendChild(link);
                });
            }
        }

        // ================================================================
        // 视觉小说模式控制器
        // ================================================================
        class VisualNovelController {
            constructor() {
                this.dialogBox = document.getElementById('vn-dialog-box');
                this.dialogText = document.getElementById('vn-dialog-text');
                this.nameTag = document.getElementById('vn-name-tag');
                this.isRunning = false;
                this.advanceHandler = null;
            }

            activate(parsedData) {
                // 从解析数据中提取对话
                this.dialogQueue = [];

                parsedData.forEach(item => {
                    if (item.type === 'paragraph') {
                        const text = item.content;
                        const dialogueMatch = text.match(/^([^「]+)?「(.+)」/);
                        if (dialogueMatch) {
                            this.dialogQueue.push({
                                speaker: dialogueMatch[1] ? dialogueMatch[1].trim() : '',
                                text: dialogueMatch[2]
                            });
                        } else {
                            this.dialogQueue.push({
                                speaker: '',
                                text: text.substring(0, 120)
                            });
                        }
                    }
                });

                this.vnCurrentIndex = 0;
                this.isRunning = true;
                this.showCurrentDialog();
                this.bindClickAdvance();
            }

            showCurrentDialog() {
                if (!this.isRunning || this.vnCurrentIndex >= this.dialogQueue.length) {
                    this.vnCurrentIndex = 0;
                }

                const dialog = this.dialogQueue[this.vnCurrentIndex];
                this.nameTag.textContent = dialog.speaker || '旁白';
                this.nameTag.style.display = dialog.speaker ? 'block' : 'none';
                this.typeWriterEffect(dialog.text);
            }

            typeWriterEffect(text) {
                this.dialogText.innerHTML = '';
                let i = 0;
                const speed = 25;

                const type = () => {
                    if (!this.isRunning) return; // 已退出VN模式则停止打字
                    if (i < text.length) {
                        this.dialogText.innerHTML += text.charAt(i);
                        i++;
                        setTimeout(type, speed);
                    }
                };
                type();
            }

            bindClickAdvance() {
                // 只在对话框区域绑定点击推进，不再用 document 全局捕获
                this.advanceHandler = () => {
                    if (!AppState.isVnMode || !this.isRunning) return;
                    this.vnCurrentIndex++;
                    this.showCurrentDialog();
                };
                this.dialogBox.addEventListener('click', this.advanceHandler);
            }

            deactivate() {
                this.isRunning = false;
                if (this.advanceHandler && this.dialogBox) {
                    this.dialogBox.removeEventListener('click', this.advanceHandler);
                }
                this.advanceHandler = null;
            }
        }

        // ================================================================
        // 初始化与主流程
        // ================================================================
        async function initializeApp() {
            // 显示 loading 打字机效果
            await showLoadingTypewriter();

            try {
                // 并行加载 MD 和 JSON 文件
                const [mdResponse, jsonResponse] = await Promise.all([
                    fetch('chapter_01/chapter_01.md'),
                    fetch('chapter_01/chapter_01_meta.json')
                ]);

                if (!mdResponse.ok) throw new Error('无法加载章节文件');
                if (!jsonResponse.ok) throw new Error('无法加载元数据文件');

                const mdText = await mdResponse.text();
                const jsonData = await jsonResponse.json();

                AppState.chapterData = mdText;
                AppState.metaData = jsonData;

                // 解析并渲染 MD 内容
                const parser = new MarkdownParser();
                const parsedData = parser.parse(mdText);

                const renderer = new Renderer('reading-stage');
                renderer.render(parsedData);

                // 渲染角色卡片
                if (jsonData.characters_appeared) {
                    CharacterRenderer.renderCards(jsonData.characters_appeared);
                }

                // 初始化粒子系统
                new ParticleSystem('particle-canvas');

                // 初始化 VN 控制器
                const vnController = new VisualNovelController();
                vnController.activate(parsedData);

                // 绑定模式切换事件
                bindModeSwitchEvents(vnController);

                // 绑定移动端菜单事件
                bindMobileMenuEvents();

                // Fade out loading → 显示主界面
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                }, 600);

            } catch (error) {
                console.error('初始化失败:', error);
                document.getElementById('loading-screen').innerHTML = `
                    <div class="loading-logo" style="font-size:1.5rem;color:#ff5f57;">ERROR</div>
                    <div class="loading-text" style="color:#ff5f57;">
                        加载失败<br>
                        <span style="font-size:12px;margin-top:8px;display:block;">请确保通过 HTTP 服务器运行此页面<br>例如: python -m http.server 8080</span>
                    </div>
                `;
            }
        }

        // Loading 打字机效果
        function showLoadingTypewriter() {
            return new Promise(resolve => {
                const messages = [
                    'INITIALIZING TERMINAL...',
                    'LOADING NARRATIVE DATA...',
                    'PARSING QUANTUM SIGNATURE...',
                    'RENDERING INTERFACE...'
                ];
                let msgIndex = 0;
                let charIndex = 0;
                const typingEl = document.getElementById('typing-text');

                const typeMessage = () => {
                    if (msgIndex >= messages.length) {
                        resolve();
                        return;
                    }

                    const message = messages[msgIndex];

                    if (charIndex < message.length) {
                        typingEl.textContent = message.substring(0, charIndex + 1);
                        charIndex++;
                        setTimeout(typeMessage, 40 + Math.random() * 30);
                    } else {
                        setTimeout(() => {
                            msgIndex++;
                            charIndex = 0;
                            typingEl.textContent = '';
                            setTimeout(typeMessage, 300);
                        }, 800);
                    }
                };

                typeMessage();

                // 超时保护
                setTimeout(resolve, 5000);
            });
        }

        // 模式切换绑定
        function bindModeSwitchEvents(vnController) {
            const btnFiction = document.getElementById('btn-fiction-mode');
            const btnVn = document.getElementById('btn-vn-mode');
            const mainContainer = document.getElementById('main-container');
            const backBtn = document.getElementById('vn-back-btn');

            btnVn.addEventListener('click', () => {
                AppState.isVnMode = true;
                mainContainer.classList.add('vn-mode');
                btnVn.classList.add('active');
                btnFiction.classList.remove('active');
                document.body.style.background = 'linear-gradient(135deg, #050810 0%, #0a0f1f 100%)';
            });

            const switchToFiction = () => {
                AppState.isVnMode = false;
                mainContainer.classList.remove('vn-mode');
                btnFiction.classList.add('active');
                btnVn.classList.remove('active');
                document.body.style.background = '';
                vnController.deactivate();
            };

            btnFiction.addEventListener('click', switchToFiction);
            backBtn.addEventListener('click', switchToFiction);

            // 主题切换绑定
            const btnThemeDark = document.getElementById('btn-theme-dark');
            const btnThemeLight = document.getElementById('btn-theme-light');

            btnThemeDark.addEventListener('click', () => {
                document.documentElement.removeAttribute('data-theme');
                btnThemeDark.classList.add('active');
                btnThemeLight.classList.remove('active');
            });

            btnThemeLight.addEventListener('click', () => {
                document.documentElement.setAttribute('data-theme', 'light');
                btnThemeLight.classList.add('active');
                btnThemeDark.classList.remove('active');
            });
        }

        // 移动端菜单绑定
        function bindMobileMenuEvents() {
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const sidebarLeft = document.getElementById('sidebar-left');
            const overlay = document.getElementById('mobile-overlay');

            const openMenu = () => {
                sidebarLeft.classList.add('mobile-open');
                overlay.classList.add('active');
            };

            const closeMenu = () => {
                sidebarLeft.classList.remove('mobile-open');
                overlay.classList.remove('active');
            };

            hamburgerBtn.addEventListener('click', openMenu);
            overlay.addEventListener('click', closeMenu);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
